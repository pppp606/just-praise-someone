openapi: 3.0.0
info:
  title: Just Praise Someone API
  version: 1.0.0
  description: Just Praise SomeoneのAPI仕様書

servers:
  - url: /api
    description: APIのベースURL

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        name:
          type: string
        email:
          type: string
        emailVerified:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        profile:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        providerAccountId:
          type: string
        providerUserId:
          type: string
        image:
          type: string
        bio:
          type: string
        snsLinks:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Praise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        givenUserId:
          type: string
          format: uuid
        receivedUserId:
          type: string
          format: uuid
        content:
          type: string
          maxLength: 255
        isApproved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'

    Skill:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        sortOrder:
          type: integer

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [new_praise, system_announcement]
          description: |
            new_praise - 新しい褒めが届いた場合
            system_announcement - システムからのお知らせ
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 通知のメタデータ（キーバリュー形式）

    NotificationList:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        totalCount:
          type: integer
        hasMore:
          type: boolean

    Group:
      type: object
      properties:
        id:
          type: string
          format: cuid
        name:
          type: string
          nullable: true
        isDm:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
          description: 最後のメッセージが送信された日時
        groupUsers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: cuid
              userId:
                type: string
                format: uuid
              groupId:
                type: string
                format: cuid
              isAdmin:
                type: boolean
              isPending:
                type: boolean
              user:
                $ref: '#/components/schemas/User'

    GroupUser:
      type: object
      properties:
        id:
          type: string
          format: cuid
        userId:
          type: string
          format: uuid
        groupId:
          type: string
          format: cuid
        isAdmin:
          type: boolean
        isPending:
          type: boolean
        user:
          $ref: '#/components/schemas/User'

paths:
  /auth/[...nextauth]:
    get:
      summary: NextAuth認証エンドポイント
      tags:
        - Authentication
      responses:
        '200':
          description: 認証成功
    post:
      summary: NextAuth認証エンドポイント
      tags:
        - Authentication
      responses:
        '200':
          description: 認証成功

  /users/{id}:
    get:
      summary: ユーザー情報の取得
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: ユーザーが見つかりません

    put:
      summary: ユーザー情報の更新
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: 更新成功
        '404':
          description: ユーザーが見つかりません
        '401':
          description: 認証エラー

    delete:
      summary: ユーザーの削除
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 削除成功
        '404':
          description: ユーザーが見つかりません
        '401':
          description: 認証エラー

  /praises:
    get:
      summary: 褒めの一覧取得
      tags:
        - Praises
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [received, given]
        - name: page
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 褒めの一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Praise'
        '400':
          description: バリデーションエラー
    post:
      summary: 新しい褒めの作成
      tags:
        - Praises
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
                - receivedUserId
              properties:
                content:
                  type: string
                  maxLength: 255
                  description: 褒めの内容
                receivedUserId:
                  type: string
                  format: uuid
                  description: 褒められるユーザーのID
                skills:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: 関連するスキルのIDリスト
      responses:
        '201':
          description: 褒めの作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Praise'

  /praises/{id}:
    get:
      summary: 特定の褒めの取得
      tags:
        - Praises
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 褒めの詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Praise'
        '404':
          description: 褒めが見つかりません

    put:
      summary: 褒めの更新
      tags:
        - Praises
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Praise'
      responses:
        '200':
          description: 更新成功
        '404':
          description: 褒めが見つかりません
        '401':
          description: 認証エラー

    delete:
      summary: 褒めの削除
      tags:
        - Praises
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 削除成功
        '404':
          description: 褒めが見つかりません
        '401':
          description: 認証エラー

    patch:
      summary: 褒めの承認状態の更新
      tags:
        - Praises
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isApproved:
                  type: boolean
      responses:
        '200':
          description: 更新成功
        '404':
          description: 褒めが見つかりません
        '401':
          description: 認証エラー

  /skills:
    get:
      summary: スキル一覧の取得
      tags:
        - Skills
      responses:
        '200':
          description: スキル一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'

  /github/events/{userId}:
    get:
      summary: GitHubイベントの取得
      tags:
        - GitHub
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: GitHubイベント一覧
        '404':
          description: ユーザーが見つかりません

  /ai-praise:
    post:
      summary: AIによる褒めの生成
      tags:
        - AI
      responses:
        '201':
          description: 生成ジョブの作成成功
        '404':
          description: ユーザーが見つかりません
        '401':
          description: 認証エラー


  /notifications:
    get:
      summary: 通知一覧の取得
      tags:
        - Notifications
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 通知一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          description: 認証エラー

  /notifications/{id}/read:
    patch:
      summary: 通知を既読にする
      tags:
        - Notifications
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 更新成功
        '401':
          description: 認証エラー
        '404':
          description: 通知が見つかりません

  /groups:
    get:
      summary: グループ一覧の取得
      description: ユーザーが所属するグループの一覧を取得します
      parameters:
        - name: isDm
          in: query
          description: DMグループのみを取得する場合はtrueを指定
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: グループ一覧の取得に成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: グループの作成
      description: 新しいグループを作成します
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isDm
                - userIds
              properties:
                name:
                  type: string
                  description: グループ名（DMグループの場合は任意）
                isDm:
                  type: boolean
                  description: DMグループかどうか
                userIds:
                  type: array
                  items:
                    type: string
                  description: グループに参加させるユーザーIDの配列（DMグループの場合は2人のみ）
      responses:
        '201':
          description: グループの作成に成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /groups/{groupId}:
    put:
      summary: グループ名の更新
      description: グループ名を更新します（管理者のみ可能、DMグループの場合は全員可能）
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
          description: グループID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: 新しいグループ名
      responses:
        '200':
          description: グループ名の更新に成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 管理者権限がない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: グループが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError' 